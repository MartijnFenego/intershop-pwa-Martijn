<h1>{{ 'account.costcenter.create.heading' | translate }}</h1>

<form [formGroup]="form" (ngSubmit)="submitForm()" ishFormSubmit #ccForm="ngForm" class="form-horizontal" novalidate>
  <ish-cost-center-form [form]="form" />
  <div class="row">
    <div class="offset-md-4 col-md-8">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid && ccForm.submitted"
        data-testing-id="create-cost-center-submit"
      >
        {{ 'account.costcenter.create.button.label' | translate }}
      </button>
      <a routerLink="../" class="btn btn-secondary" data-testing-id="create-cost-center-cancel">{{
        'account.cancel.link' | translate
      }}</a>
    </div>
  </div>
</form>

<ish-csv-import
  [subtitleKey]="'account.costcenter.create.csv.subtitle' | translate"
  [sampleTextKey]="'csv.file.sample' | translate : { '0': 'assets/sample-data/Cost Center import sample data.csv' }"
  [expectedHeaders]="costCenterHeaders"
  (csvParsed)="handleCsvImport($event)"
/>

<div>
  <button
    type="submit"
    class="btn btn-primary"
    (click)="submitCostCenterImports()"
    data-testing-id="create-cost-center-submit"
    [disabled]="!csvData || csvData.length === 0"
  >
    {{ 'account.costcenter.create.button.label' | translate }}
  </button>

  <button type="reset" class="btn btn-link" name="reset" (click)="resetCsvData()">
    {{ 'csv.reset.button.label' | translate }}
  </button>
</div>

<ish-loading *ngIf="loading$ | async" />
